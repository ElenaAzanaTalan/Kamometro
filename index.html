<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamómetro ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
background:#FFE6F0;
display:flex;
justify-content:center;
padding:18px;
}
.app{
width:390px;
min-height:840px;
background:#FFF8FB;
border-radius:30px;
overflow:hidden;
box-shadow:0 20px 40px rgba(0,0,0,.25);
position:relative;
}
header{
background:linear-gradient(135deg,#FF5C8A,#FF8DB1);
color:white;
padding:18px;
display:flex;
align-items:center;
gap:15px;
}
header img{
width:82px;
height:82px;
border-radius:50%;
object-fit:cover;
border:3px solid white;
}
header h1{font-size:28px}
header p{font-size:13px}
.hero{
padding:18px;
text-align:center;
}
.hero h2{
color:#E33572;
margin-bottom:6px;
}
.hero p{
color:#666;
font-style:italic;
}
#pantalla{
padding:0 16px 95px;
}
.card{
background:white;
border-radius:18px;
padding:15px;
margin-bottom:14px;
box-shadow:0 5px 12px rgba(0,0,0,.08);
}
.card h3{
color:#D62D69;
margin-bottom:10px;
font-size:18px;
}
.opciones{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:10px;
}
.op{
border:2px solid #FFD3E2;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
background:#FFF;
transition:.2s;
font-size:14px;
}
.op.activa{
background:#FF5C8A;
color:white;
border-color:#FF5C8A;
}
.boton{
width:100%;
background:#FF4F85;
color:white;
border:none;
border-radius:30px;
padding:15px;
font-size:18px;
cursor:pointer;
margin-top:10px;
}
.boton.sec{
background:#999;
}
nav{
position:absolute;
bottom:0;
width:100%;
height:70px;
display:flex;
border-top:1px solid #eee;
background:white;
}
nav button{
flex:1;
border:none;
background:none;
font-size:11px;
color:#555;
}
nav span{
display:block;
font-size:22px;
}
.grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
}
.dia{
background:white;
border-radius:10px;
min-height:48px;
text-align:center;
padding-top:8px;
cursor:pointer;
box-shadow:0 2px 6px rgba(0,0,0,.06);
}
.punto{
width:8px;
height:8px;
background:#FF4F85;
border-radius:50%;
margin:5px auto 0;
}
.resumen{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.caja{
background:white;
border-radius:16px;
padding:12px;
text-align:center;
}
.caja h2{
color:#E33572;
font-size:26px;
}
.termometro{
height:240px;
width:70px;
background:#FFE4ED;
border-radius:40px;
margin:18px auto;
position:relative;
border:4px solid #FF8DB1;
overflow:hidden;
}
.nivel{
position:absolute;
bottom:0;
width:100%;
background:linear-gradient(#FF296D,#FF84A8);
height:20%;
transition:.4s;
}
.bola{
width:96px;
height:96px;
border-radius:50%;
background:#FF296D;
position:absolute;
bottom:-18px;
left:50%;
transform:translateX(-50%);
border:5px solid #FFD4E3;
}
.resultado{
text-align:center;
}
.resultado h2{
color:#E52C6E;
font-size:28px;
margin-bottom:6px;
}
.mini{
font-size:13px;
color:#666;
}
</style>
</head>

<body>

<div class="app">

<header>

<img src="ka.jpg" onerror="this.src='https://placehold.co/200x200?text=KA'">

<div>
<h1>❤️ Kamómetro</h1>
<p id="fecha"></p>
</div>

</header>

<div class="hero">

<h2>Termómetro del Amor</h2>

<p>“Las pequeñas cosas también cuentan” ❤️</p>

</div>

<div id="pantalla"></div>

<nav>

<button onclick="inicio()">
<span>❤️</span>Hoy
</button>

<button onclick="calendario()">
<span>📅</span>Calendario
</button>

<button onclick="historico()">
<span>📊</span>Histórico
</button>

<button onclick="nosotros()">
<span>💕</span>Nosotros
</button>

</nav>

</div>

<script>

const pantalla=document.getElementById("pantalla");

let diario=JSON.parse(localStorage.getItem("kamometro"))||[];

const hoy=new Date();

document.getElementById("fecha").innerText=
hoy.toLocaleDateString("es-ES",{
weekday:"long",
day:"numeric",
month:"long"
});

let respuestas={
sentir:"",
mejor:"",
buenos:"",
cambiar:"",
planes:""
};

function seleccionar(grupo,valor,el){

respuestas[grupo]=valor;

document.querySelectorAll(`[data-grupo='${grupo}']`)
.forEach(x=>x.classList.remove("activa"));

el.classList.add("activa");

}

function crearFormulario(){

pantalla.innerHTML=`

<div class="card">
<h3>😊 ¿Qué tal te sientes hoy Ka?</h3>
<div class="opciones">
<div class="op" data-grupo="sentir" onclick="seleccionar('sentir',2,this)">😍 Genial</div>
<div class="op" data-grupo="sentir" onclick="seleccionar('sentir',1,this)">🙂 Bien</div>
<div class="op" data-grupo="sentir" onclick="seleccionar('sentir',0,this)">😐 Aceptable</div>
<div class="op" data-grupo="sentir" onclick="seleccionar('sentir',-1,this)">😕 Regular</div>
<div class="op" style="grid-column:1/3" data-grupo="sentir" onclick="seleccionar('sentir',-2,this)">😢 Mal</div>
</div>
</div>

<div class="card">
<h3>☀️ ¿Crees que hoy irá mejor que ayer?</h3>
<div class="opciones">
<div class="op" data-grupo="mejor" onclick="seleccionar('mejor',2,this)">Claro que sí</div>
<div class="op" data-grupo="mejor" onclick="seleccionar('mejor',1,this)">Sí</div>
<div class="op" data-grupo="mejor" onclick="seleccionar('mejor',0,this)">Quizás</div>
<div class="op" data-grupo="mejor" onclick="seleccionar('mejor',-2,this)">NO</div>
</div>
</div>

<div class="card">
<h3>🌅 ¿Te has dado ya los buenos días con tu chica?</h3>
<div class="opciones">
<div class="op" data-grupo="buenos" onclick="seleccionar('buenos',2,this)">Sí</div>
<div class="op" data-grupo="buenos" onclick="seleccionar('buenos',-1,this)">No</div>
<div class="op" style="grid-column:1/3" data-grupo="buenos" onclick="seleccionar('buenos',-2,this)">No ni se espera</div>
</div>
</div>

<div class="card">
<h3>🌸 ¿Puedes cambiar algo para mejorar el día?</h3>
<div class="opciones">
<div class="op" data-grupo="cambiar" onclick="seleccionar('cambiar',2,this)">Claro que sí</div>
<div class="op" data-grupo="cambiar" onclick="seleccionar('cambiar',1,this)">Sí</div>
<div class="op" data-grupo="cambiar" onclick="seleccionar('cambiar',0,this)">Quizás</div>
<div class="op" data-grupo="cambiar" onclick="seleccionar('cambiar',-2,this)">NO</div>
</div>
</div>

<div class="card">
<h3>💕 ¿Has hecho o vas a hacer planes para verla hoy?</h3>
<div class="opciones">
<div class="op" data-grupo="planes" onclick="seleccionar('planes',2,this)">Sí</div>
<div class="op" data-grupo="planes" onclick="seleccionar('planes',-1,this)">No</div>
<div class="op" style="grid-column:1/3" data-grupo="planes" onclick="seleccionar('planes',-2,this)">No ni se espera</div>
</div>
</div>

<button class="boton" onclick="guardarHoy()">
❤️ Calcular Kamómetro
</button>

`;

}

function inicio(){

const hoyISO=new Date().toISOString().split("T")[0];

const existe=diario.find(x=>x.fecha===hoyISO);

if(existe){

pantalla.innerHTML=`

<div class="card" style="text-align:center">

<h3>❤️ Ya has completado el Kamómetro de hoy</h3>

<p style="margin:10px 0">
Puedes ver el resultado o reiniciar las respuestas.
</p>

<button class="boton" onclick="mostrarResultado(existe)">
Ver resultado
</button>

<button class="boton sec" onclick="reiniciarHoy()">
🔄 Reiniciar hoy
</button>

</div>`;

return;

}

respuestas={
sentir:"",
mejor:"",
buenos:"",
cambiar:"",
planes:""
};

crearFormulario();
function reiniciarHoy(){

const hoyISO=new Date().toISOString().split("T")[0];

diario=diario.filter(x=>x.fecha!==hoyISO);

localStorage.setItem("kamometro",JSON.stringify(diario));

respuestas={
sentir:"",
mejor:"",
buenos:"",
cambiar:"",
planes:""
};

crearFormulario();

}

function guardarHoy(){

const fecha=new Date().toISOString().split("T")[0];

const puntos=
Number(respuestas.sentir)+
Number(respuestas.mejor)+
Number(respuestas.buenos)+
Number(respuestas.cambiar)+
Number(respuestas.planes);

const registro={
fecha,
puntos,
respuestas:{...respuestas}
};

diario=diario.filter(d=>d.fecha!==fecha);

diario.push(registro);

localStorage.setItem("kamometro",JSON.stringify(diario));

mostrarResultado(registro);

}

function nivel(p){

if(p>=8)
return{
texto:"❤️ Estáis a tope",
altura:100,
emoji:"😍",
color:"#FF296D"
};

if(p>=4)
return{
texto:"💖 Todo está bien",
altura:80,
emoji:"😊",
color:"#FF5F88"
};

if(p>=1)
return{
texto:"💛 Tranquila",
altura:60,
emoji:"🙂",
color:"#FFC94D"
};

if(p>=-4)
return{
texto:"🧡 Deberíais mejorar",
altura:35,
emoji:"😕",
color:"#FF9B47"
};

return{
texto:"💔 Esto no hay por donde pillarlo",
altura:15,
emoji:"😢",
color:"#7C63FF"
};

}

function mostrarResultado(dia){

const r=nivel(dia.puntos);

pantalla.innerHTML=`

<div class="resultado">

<h2>${r.texto}</h2>

<p class="mini">
Hoy el Kamómetro marca ${dia.puntos} puntos
</p>

<div class="termometro">

<div class="nivel"
style="height:${r.altura}%;background:${r.color}">
</div>

<div class="bola"></div>

</div>

<div style="font-size:58px">
${r.emoji}
</div>

</div>

<div class="card">

<h3>Resultado de hoy</h3>

<p><b>Estado:</b> ${emojiSentir(dia.respuestas.sentir)}</p>

<p><b>¿Irá mejor?</b> ${textoSi(dia.respuestas.mejor)}</p>

<p><b>Buenos días:</b> ${textoBuenos(dia.respuestas.buenos)}</p>

<p><b>¿Puedes mejorarlo?</b> ${textoSi(dia.respuestas.cambiar)}</p>

<p><b>¿Habrá planes?</b> ${textoPlanes(dia.respuestas.planes)}</p>

</div>

<button class="boton sec" onclick="reiniciarHoy()">
🔄 Volver a contestar hoy
</button>

`;

}

function emojiSentir(v){

if(v==2)return"😍 Genial";
if(v==1)return"🙂 Bien";
if(v==0)return"😐 Aceptable";
if(v==-1)return"😕 Regular";
return"😢 Mal";

}

function textoSi(v){

if(v==2)return"Claro que sí";
if(v==1)return"Sí";
if(v==0)return"Quizás";
return"NO";

}

function textoBuenos(v){

if(v==2)return"Sí";
if(v==-1)return"No";
return"No ni se espera";

}

function textoPlanes(v){

if(v==2)return"Sí";
if(v==-1)return"No";
return"No ni se espera";

}

function calendario(){

const y=hoy.getFullYear();
const m=hoy.getMonth();

const primer=new Date(y,m,1);

const offset=(primer.getDay()+6)%7;

const diasMes=new Date(y,m+1,0).getDate();

const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let html=`
<h2 style="color:#E33572;margin-bottom:12px">
📅 ${meses[m]} ${y}
</h2>

<div class="grid">`;

["L","M","M","J","V","S","D"].forEach(d=>{

html+=`
<div style="text-align:center;font-weight:bold;color:#666">
${d}
</div>`;

});

for(let i=0;i<offset;i++)html+="<div></div>";

for(let d=1;d<=diasMes;d++){

const fecha=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

const existe=diario.find(x=>x.fecha===fecha);

html+=`
<div class="dia" onclick="verDia('${fecha}')">

${d}

${existe?'<div class="punto"></div>':""}

</div>`;

}

html+=`</div><div id="detalle" style="margin-top:18px"></div>`;

pantalla.innerHTML=html;

}

function verDia(fecha){

const d=diario.find(x=>x.fecha===fecha);

if(!d){

detalle.innerHTML=`
<div class="card">
No hay registro ❤️
</div>`;
return;

}

const r=nivel(d.puntos);

detalle.innerHTML=`

<div class="card">

<h3>${fecha}</h3>

<div style="font-size:42px;text-align:center;margin:10px 0">
${r.emoji}
</div>

<p><b>${r.texto}</b></p>

<p>Puntuación: ${d.puntos}</p>

</div>`;

}

function historico(){

let tope=0;
let bien=0;
let mejorar=0;

diario.forEach(d=>{

if(d.puntos>=8)tope++;
else if(d.puntos>=4)bien++;
else if(d.puntos<1)mejorar++;

});

pantalla.innerHTML=`

<h2 style="color:#E33572;margin-bottom:12px">
📊 Histórico
</h2>

<div class="resumen">

<div class="caja">
<h2>${diario.length}</h2>
<p>Días</p>
</div>

<div class="caja">
<h2>${tope}</h2>
<p>A tope</p>
</div>

<div class="caja">
<h2>${bien}</h2>
<p>Bien</p>
</div>

<div class="caja">
<h2>${mejorar}</h2>
<p>Mejorar</p>
</div>

</div>

`;

const orden=[...diario].sort((a,b)=>b.fecha.localeCompare(a.fecha));

orden.forEach(d=>{

const r=nivel(d.puntos);

pantalla.innerHTML+=`

<div class="card">

<div style="display:flex;justify-content:space-between">

<b>${d.fecha}</b>

<span>${r.emoji}</span>

</div>

<p style="margin-top:8px">
${r.texto}
</p>

<p style="color:#666">
${d.puntos} puntos
</p>

</div>`;

});

if(orden.length===0){

pantalla.innerHTML+=`
<div class="card">
Todavía no hay registros.
</div>`;

}

}

function nosotros(){

pantalla.innerHTML=`

<div class="card" style="text-align:center">

<img src="ka.jpg"
style="width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #FF8DB1;margin-bottom:12px;">

<div style="font-size:60px">❤️</div>

<h3>Kamómetro</h3>

<p style="margin-top:10px">
Esta aplicación está hecha para cuidar vuestro amor día a día.
</p>

<p style="margin-top:16px;color:#E33572;font-weight:bold;">
“Las pequeñas cosas también cuentan”
</p>

</div>`;

}

inicio();

</script>

</body>
</html>

}
